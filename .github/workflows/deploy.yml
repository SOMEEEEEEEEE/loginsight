name: CI-CD Pipeline

on:
  push:
    branches:
      - cloud-native

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:

  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [ingest, query, worker, nginx]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build ${{ matrix.service }}
        run: |
          docker build \
            -t $DOCKER_USERNAME/loginsight-${{ matrix.service }}:$IMAGE_TAG \
            -f docker/${{ matrix.service }}.Dockerfile .


      - name: Push ${{ matrix.service }}
        run: |
          docker push $DOCKER_USERNAME/loginsight-${{ matrix.service }}:$IMAGE_TAG

  cd:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "Starting deployment..."

            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            export IMAGE_TAG=${{ github.sha }}

            cd ~/log-insight

            echo "Pull latest images..."
            docker-compose -f docker-compose.prod.yml pull

            echo "Restart services..."
            docker-compose -f docker-compose.prod.yml up -d  --remove-orphans

            echo "Deployment success"
            echo "Cleanup unused images..."
            docker image prune -f

