name: CI/CD - Build, Scan, Push, Deploy

on:
  push:
    branches:
      - cloud-native

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # =========================
  # CI STAGE
  # =========================
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [ingest, query, worker, nginx]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Build image (local)
      # -------------------------
      - name: Build ${{ matrix.service }}
        run: |
          docker build \
            -t $DOCKER_USERNAME/loginsight-${{ matrix.service }}:$IMAGE_TAG \
            -f ${{ matrix.service }}/Dockerfile .

      # -------------------------
      # FIXED: Trivy scan (local image, no docker.sock dependency)
      # -------------------------
      - name: Scan ${{ matrix.service }} image (Trivy)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            $DOCKER_USERNAME/loginsight-${{ matrix.service }}:$IMAGE_TAG

      # -------------------------
      # Docker Hub login
      # -------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -------------------------
      # Push image
      # -------------------------
      - name: Push ${{ matrix.service }} image
        run: |
          docker push $DOCKER_USERNAME/loginsight-${{ matrix.service }}:$IMAGE_TAG


  # =========================
  # CD STAGE
  # =========================
  cd:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "Deploying LogInsight..."

            cd ~/cloud-native

            export IMAGE_TAG=${{ github.sha }}
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

            docker-compose pull
            docker-compose up -d --remove-orphans

            echo "Deployment completed successfully"