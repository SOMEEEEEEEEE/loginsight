name: Build & Push to DockerHub

on:
  push:
    branches:
      - cloud-native

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push ingest
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/loginsight-ingest:latest -f ingest/Dockerfile .
        docker push ${{ secrets.DOCKER_USERNAME }}/loginsight-ingest:latest

    - name: Build and push query
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/loginsight-query:latest -f query/Dockerfile .
        docker push ${{ secrets.DOCKER_USERNAME }}/loginsight-query:latest

    - name: Build and push worker
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/loginsight-worker:latest -f worker/Dockerfile .
        docker push ${{ secrets.DOCKER_USERNAME }}/loginsight-worker:latest

    - name: Build and push nginx
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/loginsight-nginx:latest -f nginx/Dockerfile .
        docker push ${{ secrets.DOCKER_USERNAME }}/loginsight-nginx:latest