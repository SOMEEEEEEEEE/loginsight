version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    container_name: loginsight-api
    ports:
      - "8000:8000"
    env_file:
      - .env

  worker:
    build:
      context: .
      dockerfile:  ./worker/Dockerfile
    container_name: loginsight-worker
    env_file:
      - .env

  nginx:
    image: nginx:latest
    container_name: loginsight-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api