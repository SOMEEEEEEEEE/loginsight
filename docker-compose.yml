version: "3.9"

services:

  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    container_name: loginsight-ingest
    ports:
      - "8001:8001"
    env_file:
      - .env

  query:
    build:
      context: .
      dockerfile: query/Dockerfile
    container_name: loginsight-query
    ports:
      - "8002:8002"
    env_file:
      - .env

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: loginsight-worker
    env_file:
      - .env

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: loginsight-nginx
    ports:
      - "80:80"
    depends_on:
      - ingest
      - query