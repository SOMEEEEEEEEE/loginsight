version: "3.9"

services:
  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    container_name: loginsight-ingest
    env_file:
      - .env
    ports:
      - "8001:8000"

  query:
    build:
      context: .
      dockerfile: query/Dockerfile
    container_name: loginsight-query
    env_file:
      - .env
    ports:
      - "8002:8000"

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: loginsight-worker
    env_file:
      - .env
    depends_on:
      - ingest

  nginx:
    image: nginx:latest
    container_name: loginsight-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ingest
      - query